name: Atualizar dados de transparência

on:
  schedule:
    # Todo dia às 09:00 (horário de Brasília = UTC-3, então 12:00 UTC)
    - cron: "0 12 * * *"
  workflow_dispatch: {}  # permite rodar manualmente pelo botão "Run workflow" no GitHub

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar coleta de dados
        run: python3 coletar_dados.py

      - name: Publicar mudanças no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Atualização automática de dados de transparência"
          git push
